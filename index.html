<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/main.css" />
    <script type="module" src="./src/js/controller.js"></script>
    <title>To-Do</title>
  </head>
  <body>
    <section class="todo-app">
      <div class="todo-input-wrapper">
        <form class="todo-form">
          <input
            type="text"
            class="todo-input"
            minlength="3"
            maxlength="25"
            placeholder="Task Name"
          />
          <span class="todo-submit-btn">
            <i class="ph ph-plus-square todo-add-icon"></i>
          </span>
        </form>
      </div>

      <div class="todo-list-wrapper">
        <!-- <div class="todo-item" data-id="">
          <input type="checkbox" class="todo-checkbox" />
          <label class="todo-label">New Task</label>
          <span class="todo-delete-btn">
            <i class="ph ph-x"></i>
          </span>
        </div> -->
      </div>
    </section>
  </body>
</html>
